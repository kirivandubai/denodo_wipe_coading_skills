# --- Full cache of iv_household_income: on, load, clear and off ------------------------------
# The three blocks of skills/cache/SKILL.md, in the order the skill applies them, over the
# derived view the views step created. They write outside the test database in one way only:
# the cache table of that view lives in the server's cache data source, and it goes with the
# view when [cleanup] drops the database (documentation, section "Freeing the space" of
# skills/cache/references/full-cache.md). Each check asserts what the skill claims about its
# block, not only that the server accepted it.

[[step]]
