substitute = { sales_analytics = "{database}" }
database = "{database}"
# Complete, and read through the view built on the cached one: household_income_by_band had
# been queried before the load (derived-views), which is exactly the reader a NO_STATUS cache
# leaves on a dropped table. Every household has an income band, so the per-band counts add
# up to the households of the base view, which is not cached.
check = "SELECT b.n FROM (SELECT SUM(household_count) AS n FROM household_income_by_band) b, (SELECT COUNT(*) AS m FROM bv_household_demographics) s WHERE b.n = s.m AND b.n > 0"

# --- Scheduler tail: http channel, gated behind --with-scheduler -----------------------
#
# Between the load above and the clear below, while iv_household_income has a full cache: the
# cache job of skills/scheduler reloads it twice, and the second run must leave exactly one
# copy — the claim of its "ALL_ROWS" line (the default, NONE, appends). The project is the
# run's own, named with the verify_ prefix and deleted in [cleanup] http, which takes its jobs
# and their reports with it. The jobs reach Virtual DataPort through an existing VDP data
# source of the Scheduler, named in [values] scheduler_data_source_id: creating one needs a
# password, which the skill leaves to the human. The export step leaves one file on the
# Scheduler host, verify_household_income_by_band.csv in its default export folder; every run
# overwrites it, and no API call removes it.

[[step]]
id = "scheduler-project"
kind = "template"
channel = "http"
scheduler = true
address = "skills/scheduler/SKILL.md#The project"
