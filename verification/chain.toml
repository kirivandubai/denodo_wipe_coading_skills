# verification/chain.toml
# Verifies the templates of the skills end to end (the run reports how many). Every block of
# skills/ marked `verified:` — in a SKILL.md or in references/ — is a step here, or is listed
# under [not_run] at the end with the reason; tests/test_chain_manifest.py holds both directions.
# The steps: catalog database, folders, the DF (CSV), JSON
# and JDBC data sources, a hand-written JDBC wrapper and base view, derived views, the union
# and the array views, the interface view, the association, the column-impact queries, the
# full cache switched on, loaded and cleared, tags, the metadata audit, profile and
# write, the metric view with the views over it, its reads and the totals check, a role,
# the security reads, a masking policy, a view's tags and the check as a person, and — only
# with --with-ai, because each sends paid requests to the server's LLM — the AI functions
# over rows, a cached view of their answers and two semantic searches, and — only with
# --with-writes, because they create tables in the server's cache database and write rows
# into them — updates, inserts, deletes, a view an application writes through and an upsert,
# and a remote table with its refresh, a summary loaded and used, a data movement, a
# materialized table and the drop (vql channel), and — only with --testing-tool — the
# .denodotest templates run by the Denodo Testing Tool (denodotest channel), and — only with
# --with-scheduler — a Scheduler project with a cache job and a CSV export job, created disabled,
# read back, enabled, changed, run and reported on (http channel), plus the
# Data Marketplace catalog
# sync, a tag, a category, an external element and a renamed view that keeps its element
# (http channel). Bodies of the
# "template" steps come from the skills themselves (address = file#section); "fixture"
# steps carry their own body and verify nothing — they only make the next template
# reachable. Design spec, section 11.1.
#
# Any server runs it (T40). What belongs to an installation is not written here: a value marked
# "@server" is read from the server before the first step (scripts/denodo_cli/features.py), one
# marked "@dialect" comes from the [dialects] table of the write data source's product, and the
# values file beside the profiles (verify.toml, one table per profile) overrides any value. A step
# that `requires` a feature the server lacks — the Enterprise Plus bundle, a cache, an LLM — is
# skipped with the reason, and so is a step naming a value nobody filled in. `scripts/denodo env
# check` shows what the server has.
#
# The three file/database source steps share one predicate: the source they name does not
# exist and is not meant to. A CSV path that is not on the server, a JSON file that is not
# either, a JDBC host that does not resolve — the parser accepts all three, and only a
# SELECT would fail (spec 11.1). What the chain proves about them is that the DDL is
# right; that data reads through them is what the fixtures and the derived views prove, over
# the chain's own files (verification/data), which any server can reach.
#
# The three http steps carry marketplace = true and only run with --with-marketplace: they
# write to the shared marketplace catalog, not to denodo_skills_test alone. Two kinds of
# write, and [cleanup] http undoes both. The tag and the category are named with the
# verify_ prefix and removed by id, captured from their create call. The catalog sync is
# not named at all: marketplace-sync imports whatever VDP has, which by then includes this
# run's own database and its six views, and the only way back out is to run the same two
# synchronize calls once VDP no longer has them — which is why they are repeated at the end
# of [cleanup] http, after DROP DATABASE ... CASCADE. Without that, every run left its
# database and views behind in a catalog everyone shares, as orphans (localElements in
# .../changes), while reporting itself green.

[values]
database = "denodo_skills_test"
tag_prefix = "verify_"
# Where the fixtures read their files (verification/data: synthetic rows under the TPC-DS
# names): the route clause of a DF data source and the folder. By default over HTTP from the
# public repository; a server that cannot reach it gets the folder copied and, in its values
# file, fixture_route = "LOCAL 'LocalConnection'" with fixture_base = the folder's path. A branch
# that changes the data points fixture_base at its own raw URL.
fixture_route = "HTTP 'http.ApacheHttpClientConnection,120000' GET"
fixture_base = "https://raw.githubusercontent.com/kirivandubai/denodo_wipe_coading_skills/main/verification/data"
# The embedding model the server is configured with (Design Studio, Server configuration →
# Denodo Assistant → Embedding model), read with GET_PARAMETER — an administrator's call. The ai
# search-view step writes it into EMBED_AI, which refuses any other model.
embedding_model = "@server"
# The data source the write steps (--with-writes) create their tables in and write through: the
# server's cache data source, its catalog and schema, and its product, all from
# GET_CACHE_CONFIGURATION. A values file may point them at another data source the account may
# create tables in (then write_dialect names its product too).
write_datasource_database = "@server"
write_datasource_name = "@server"
write_catalog = "@server"
write_schema = "@server"
write_dialect = "@server"
# The two parts of the write tables' DDL each product spells its own way: an identity key that
# starts at 1001, and a timestamp to the second. From [dialects.<write_dialect>] below; another
# product sets both in the values file.
write_identity = "@dialect"
write_timestamp = "@dialect"
# Not a credential and not a literal: the JDBC template carries USERPASSWORD '...' ENCRYPTED,
# and the server validates the ciphertext at creation time ("error creating new data source:
# Invalid encrypted value" for anything it did not encrypt itself). A real ciphertext is a
# credential, and it only works on the server that made it — so the run makes its own, on the
# server it is about to write to, and throws it away with the run (commands/verify.py,
# _encrypt_throwaways). The alternative — rewriting the template to a plaintext password and
# dropping ENCRYPTED — needs no code and verifies less than the block claims.
jdbc_password = "@encrypt-throwaway"
# The Scheduler tail (--with-scheduler): the VDP data source of the Scheduler the run's jobs go
# through — the one whose login is the profile's user (GET /public/api/dataSources). Creating one
# needs a password the chain does not have; with none or several, set the id in the values file.
scheduler_data_source_id = "@server"
# The export template writes household_income_by_band, one row per income band of the fixture
# file.
band_rows = "20"
# No server_id here on purpose: the http steps and the cleanup below never name a VDP
# server, so RestTransport puts the profile's marketplace_server_id on every call
# (transports/api_rest.py). That is the only way a fork verifying against its own
# marketplace can point this chain at its own server without editing this file — an
# explicit serverId in a call always wins over the profile, so one written here would
# disable the profile mechanism for everyone. On a marketplace with several VDP servers
# registered, a profile without marketplace_server_id fails at the first tag call with
# 500 "Session Expired." (skills/marketplace/SKILL.md, "Name the server").

[dialects.sqlserver]
write_identity = "INT IDENTITY(1001,1)"
write_timestamp = "DATETIME2(0)"

[dialects.postgresql]
write_identity = "INTEGER GENERATED BY DEFAULT AS IDENTITY (START WITH 1001)"
write_timestamp = "TIMESTAMP(0)"

[cleanup]
# Only with --with-writes, and before everything below: the write steps' two tables live in the
# cache database, outside {database}, and DROP_REMOTE_TABLE drops a table only through a base
# view CREATE_REMOTE_TABLE made. So each table is first taken over by CREATE_REMOTE_TABLE
# (replace_remote_table_if_exist drops the fixture's table and makes a plain one with its base
# view in {database}), then dropped with that base view. Both work whether or not the write
# steps got as far as creating the table; DROP DATABASE below would take the base view away.
writes = [
  "SELECT remote_table, base_view, status FROM CREATE_REMOTE_TABLE() WHERE remote_table_name = '{tag_prefix}orders' AND replace_remote_table_if_exist = true AND query = 'SELECT 1 AS x FROM Dual()' AND datasource_database_name = '{write_datasource_database}' AND datasource_name = '{write_datasource_name}' AND datasource_catalog = '{write_catalog}' AND datasource_schema = '{write_schema}' AND base_view_database_name = '{database}' AND base_view_name = '{tag_prefix}orders_drop' AND replace_base_view_if_exist = true",
  "SELECT * FROM DROP_REMOTE_TABLE() WHERE base_view_database_name = '{database}' AND base_view_name = '{tag_prefix}orders_drop' AND drop_base_view_on_cascade = true",
  "SELECT remote_table, base_view, status FROM CREATE_REMOTE_TABLE() WHERE remote_table_name = '{tag_prefix}customer' AND replace_remote_table_if_exist = true AND query = 'SELECT 1 AS x FROM Dual()' AND datasource_database_name = '{write_datasource_database}' AND datasource_name = '{write_datasource_name}' AND datasource_catalog = '{write_catalog}' AND datasource_schema = '{write_schema}' AND base_view_database_name = '{database}' AND base_view_name = '{tag_prefix}customer_drop' AND replace_base_view_if_exist = true",
  "SELECT * FROM DROP_REMOTE_TABLE() WHERE base_view_database_name = '{database}' AND base_view_name = '{tag_prefix}customer_drop' AND drop_base_view_on_cascade = true",
  # the materialize steps' remote table and summary table, whether or not materialize-drop ran
  "SELECT remote_table, base_view, status FROM CREATE_REMOTE_TABLE() WHERE remote_table_name = '{tag_prefix}household_income' AND replace_remote_table_if_exist = true AND query = 'SELECT 1 AS x FROM Dual()' AND datasource_database_name = '{write_datasource_database}' AND datasource_name = '{write_datasource_name}' AND datasource_catalog = '{write_catalog}' AND datasource_schema = '{write_schema}' AND base_view_database_name = '{database}' AND base_view_name = '{tag_prefix}household_income_drop' AND replace_base_view_if_exist = true",
  "SELECT * FROM DROP_REMOTE_TABLE() WHERE base_view_database_name = '{database}' AND base_view_name = '{tag_prefix}household_income_drop' AND drop_base_view_on_cascade = true",
  "SELECT remote_table, base_view, status FROM CREATE_REMOTE_TABLE() WHERE remote_table_name = '{tag_prefix}s_household_band' AND replace_remote_table_if_exist = true AND query = 'SELECT 1 AS x FROM Dual()' AND datasource_database_name = '{write_datasource_database}' AND datasource_name = '{write_datasource_name}' AND datasource_catalog = '{write_catalog}' AND datasource_schema = '{write_schema}' AND base_view_database_name = '{database}' AND base_view_name = '{tag_prefix}s_household_band_drop' AND replace_base_view_if_exist = true",
  "SELECT * FROM DROP_REMOTE_TABLE() WHERE base_view_database_name = '{database}' AND base_view_name = '{tag_prefix}s_household_band_drop' AND drop_base_view_on_cascade = true",
]
vql = [
  # the policy first: a tag a policy names cannot be dropped without CASCADE, and CASCADE is
  # exactly what this list avoids
  "DROP GLOBAL_SECURITY_POLICY IF EXISTS {tag_prefix}analyst_masking",
  "DROP GLOBAL_SECURITY_POLICY IF EXISTS {tag_prefix}masking_ref",
  "DROP GLOBAL_SECURITY_POLICY IF EXISTS {tag_prefix}filter_emea",
  "DROP GLOBAL_SECURITY_POLICY IF EXISTS {tag_prefix}deny_all",
  "DROP DATABASE IF EXISTS {database} CASCADE",
  "DROP TAG IF EXISTS {tag_prefix}pii",
  "DROP TAG IF EXISTS {tag_prefix}finance_sensitive",
  "DROP TAG IF EXISTS {tag_prefix}mcp",
  "DROP TAG IF EXISTS {tag_prefix}personal_data",
  "DROP TAG IF EXISTS {tag_prefix}sales_territory",
  "DROP ROLE IF EXISTS {tag_prefix}sales_analyst",
  "DROP USER IF EXISTS {tag_prefix}reader",
]
http = [
  # The Scheduler tail's project, with its jobs and their reports (--with-scheduler only).
  { server = "scheduler", method = "delete", path = "/public/api/projects/{project_id}" },
  { method = "delete", path = "/public/api/tags/{tag_id}" },
  { method = "delete", path = "/public/api/category-management/categories/{category_id}" },
  # The external element's two server-level objects, in creation order reversed: the tool
  # server first, because the provider type it names cannot go while a server still uses it.
  # Deleting the server is also what removes the elements it imported — they exist only as
  # its reading of the interface view, which the DROP DATABASE above has just taken away.
  { method = "delete", path = "/public/api/external-tool-servers/{tool_server_id}" },
  { method = "delete", path = "/public/api/external-providers-types/{provider_type_id}" },
  # The same two calls marketplace-sync makes, in the same order and the same conflict mode.
  # Run now, after the vql cleanup above dropped the database, they mean the opposite thing:
  # a synchronize removes from the marketplace whatever VDP no longer has (see
  # scripts/denodo_cli/safety.py), so this pair takes this run's database and views back out
  # of the shared catalog. DATABASES first is enough on its own — removing the database
  # takes its views with it — but the pair is kept whole to match the template it undoes.
  # Both classify as "replace", so on a production profile they demand --allow-destructive
  # exactly like the DROPs above. Like the whole http tail they run only under
  # --with-marketplace: a default run put nothing into the catalog, and these two entries
  # name no captured id, so nothing else would have kept them from firing on every run.
  { method = "post", path = "/public/api/element-management/DATABASES/synchronize", json = { proceedWithConflicts = "SERVER_WITH_LOCAL_CHANGES" } },
  { method = "post", path = "/public/api/element-management/VIEWS/synchronize", json = { proceedWithConflicts = "SERVER_WITH_LOCAL_CHANGES" } },
]

[[step]]
id = "database"
kind = "template"
channel = "vql"
address = "skills/catalog/SKILL.md#Database"
substitute = { sales_analytics = "{database}" }
check = "SELECT db_name FROM GET_DATABASES() WHERE db_name = '{database}'"

[[step]]
id = "folders"
kind = "template"
channel = "vql"
address = "skills/catalog/SKILL.md#Folders"
substitute = { sales_analytics = "{database}" }
database = "{database}"
check = "SELECT name FROM GET_ELEMENTS() WHERE input_database_name = '{database}' AND type = 'folder'"

[[step]]
id = "catalog-read-database"
kind = "template"
channel = "vql"
address = "skills/catalog/references/database.md#Reading databases back"
# Read-only. The block's claim is its column list: GET_DATABASES() answers every one of them.
substitute = { "<name>" = "{database}" }
database = "{database}"

[[step]]
id = "catalog-read-folders"
kind = "template"
channel = "vql"
address = "skills/catalog/references/folders.md#Reading folders back"
substitute = { "'/<path>'" = "'/01 - connectivity'", "'<db>'" = "'{database}'" }
database = "{database}"

[[step]]
id = "datasources-peek-file"
kind = "template"
channel = "vql"
# The first look at a file nobody showed you: one text column per line. The template's file is
# the chain's CRM export; the next step, df-source, re-applies the same three objects with the
# real schema, exactly as the section tells the agent to.
address = "skills/datasources/SKILL.md#When you cannot see the file[2]"
substitute = { "LOCAL 'LocalConnection' '/data/exports/crm/customers.csv'" = "{fixture_route} '{fixture_base}/customers.csv'" }
database = "{database}"
# The header comes back as a row: the claim the section rests on.
check = "SELECT line FROM bv_crm_customers WHERE line LIKE '%cust_id%first_name%'"

[[step]]
id = "df-source"
kind = "template"
channel = "vql"
address = "skills/datasources/SKILL.md#Delimited file (CSV) — DF"
# The template's file is the chain's CRM export (verification/data/customers.csv), so the step
# proves the template reads, not only that it parses (T40).
substitute = { sales_analytics = "{database}", "LOCAL 'LocalConnection' '/data/exports/crm/customers.csv'" = "{fixture_route} '{fixture_base}/customers.csv'" }
database = "{database}"
# Every row of the file, every date parsed, and the empty emails NULL through NULLVALUE ''.
check = "SELECT COUNT(*) FROM bv_crm_customers HAVING COUNT(*) = 40 AND COUNT(created_dt) = 40 AND COUNT(email) = 36"

[[step]]
id = "datasources-find-donor"
kind = "template"
channel = "vql"
address = "skills/datasources/SKILL.md#When you cannot see the file"
# Read-only, over the whole server: the base view over the CRM file is found by a word of the
# file's name.
substitute = { "<word from the file name>" = "crm" }
database = "{database}"
check = "SELECT name FROM GET_ELEMENTS() WHERE input_database_name = '{database}' AND type = 'view' AND subtype = 'base' AND name LIKE '%crm%'"

[[step]]
id = "base-view-minimum"
kind = "template"
channel = "vql"
address = "skills/datasources/references/base-view.md#The minimum that works"
# Two of the wrapper's eight columns, under a name of its own: bv_crm_customers keeps all eight.
substitute = { "TABLE bv_crm_customers " = "TABLE bv_crm_customers_min " }
database = "{database}"
check = "SELECT COUNT(*) FROM bv_crm_customers_min HAVING COUNT(created_dt) = 40"

[[step]]
id = "df-raw-lines"
kind = "template"
channel = "vql"
address = "skills/datasources/references/df.md#Reading a file as raw lines"
# The block's file is the chain's order export; it is JSON, which the trick reads as well.
substitute = { "LOCAL 'LocalConnection' '/data/exports/oms/orders.json'" = "{fixture_route} '{fixture_base}/orders.json'" }
database = "{database}"
check = "SELECT name FROM GET_ELEMENTS() WHERE input_database_name = '{database}' AND name = 'wr_peek'"

[[step]]
id = "json-source"
kind = "template"
channel = "vql"
address = "skills/datasources/SKILL.md#JSON file"
# The template's file is the chain's order export (verification/data/orders.json: 3 orders,
# 4 lines). The three CREATE TYPE statements are part of the predicate, not scaffolding — a
# compound column cannot be declared inline, so a template that got them wrong would fail
# here and nowhere else.
substitute = { sales_analytics = "{database}", "LOCAL 'LocalConnection' '/data/exports/oms/orders.json'" = "{fixture_route} '{fixture_base}/orders.json'" }
database = "{database}"
# Every order, and a filter on a top-level field honoured — the CONSTRAINTS clause is what
# makes a JSON base view filter at all (datasources, "JSON file").
check = "SELECT o.n FROM (SELECT COUNT(*) AS n FROM bv_oms_orders) o, (SELECT COUNT(*) AS m FROM bv_oms_orders WHERE status = 'open') f WHERE o.n = 3 AND f.m = 1"

[[step]]
id = "json-types"
kind = "template"
channel = "vql"
address = "skills/datasources/references/json.md#Compound columns need named types"
database = "{database}"
check = "SELECT name FROM GET_ELEMENTS() WHERE input_database_name = '{database}' AND type = 'type' AND name = 'oms_order_line_array'"

[[step]]
id = "json-wrapper-shape"
kind = "template"
channel = "vql"
address = "skills/datasources/references/json.md#The shape that works"
# The block is the shape of the wrapper's body; the statement around it is the JSON template's.
substitute = { "TUPLEROOT '/JSONFile/JSONArray'" = "CREATE OR REPLACE WRAPPER JSON wr_oms_orders_shape\n    DATASOURCENAME = ds_oms\n    TUPLEROOT '/JSONFile/JSONArray'" }
database = "{database}"
check = "SELECT name FROM GET_ELEMENTS() WHERE input_database_name = '{database}' AND name = 'wr_oms_orders_shape'"

[[step]]
id = "json-flatten-read"
kind = "template"
channel = "vql"
address = "skills/datasources/references/json.md#Reading the data"
# The block's query, without the lines that show its answer.
substitute = { "\n→ order_id, customer_id, order_dt, status, total_amount, shipping,\n  line_no, sku, qty, price          -- 3 orders, 4 lines → 4 rows" = "" }
database = "{database}"
# What those lines say: 3 orders, 4 lines, 4 rows.
check = "SELECT COUNT(*) FROM FLATTEN bv_oms_orders AS v (v.lines) HAVING COUNT(*) = 4"

[[step]]
id = "jdbc-source"
kind = "template"
channel = "vql"
address = "skills/datasources/SKILL.md#Relational database over JDBC[0]"
substitute = { sales_analytics = "{database}", "<ciphertext — see Passwords below; fill it in before applying>" = "{jdbc_password}" }
database = "{database}"
# The host oracle-edw.internal is unreachable from the server on purpose (design spec 11.1:
# the DDL parses without the source existing). The password is the one part that cannot be
# faked — see jdbc_password above.
check = "SELECT name FROM GET_ELEMENTS() WHERE input_database_name = '{database}' AND name = 'ds_orders_db'"

[[step]]
id = "jdbc-base-view"
kind = "template"
channel = "vql"
# The third block of that section — the wrapper and base view written by hand for a source
# that cannot be introspected. The second block (PING_DATA_SOURCE, GET_JDBC_DATASOURCE_TABLES,
# GENERATE_VQL_TO_CREATE_JDBC_BASE_VIEW) is deliberately not a step: introspection needs a
# database that actually answers, i.e. a real credential, and this chain has none by
# construction. Its mark stays what T8b established against live Oracle, SQL Server and
# PostgreSQL, and no run here will re-date it.
address = "skills/datasources/SKILL.md#Relational database over JDBC[2]"
# This block carries no CONNECT DATABASE of its own (same as interface-view below).
database = "{database}"
check = "SELECT name FROM GET_ELEMENTS() WHERE input_database_name = '{database}' AND name = 'bv_orders_db_orders'"

[[step]]
id = "fixture-base-views"
kind = "fixture"
channel = "vql"
database = "{database}"
check = "SELECT COUNT(*) AS n FROM bv_income_band"
vql = """
CONNECT DATABASE {database};

CREATE OR REPLACE DATASOURCE DF ds_demo_csv
    FOLDER = '/01 - connectivity'
    IGNOREMATCHINGERRORS = FALSE
    ROUTE {fixture_route} '{fixture_base}/income_band.csv'
    CHARSET = 'UTF-8'
    COLUMNDELIMITER = ','
    HEADER = TRUE;

CREATE OR REPLACE WRAPPER DF wr_income_band
    FOLDER = '/01 - connectivity'
    DATASOURCENAME = ds_demo_csv
    OUTPUTSCHEMA (
        ib_income_band_sk = '"IB_INCOME_BAND_SK"',
        ib_lower_bound = '"IB_LOWER_BOUND"',
        ib_upper_bound = '"IB_UPPER_BOUND"'
    );

CREATE OR REPLACE TABLE bv_income_band I18N us_pst (
        ib_income_band_sk:int, ib_lower_bound:int, ib_upper_bound:int
    )
    FOLDER = '/01 - connectivity'
    PRIMARY KEY ( 'ib_income_band_sk' )
    CACHE OFF
    TIMETOLIVEINCACHE DEFAULT
    ADD SEARCHMETHOD wr_income_band (
        OUTPUTLIST ( ib_income_band_sk, ib_lower_bound, ib_upper_bound )
        WRAPPER (df wr_income_band)
    );

CREATE OR REPLACE DATASOURCE DF ds_demo_households
    FOLDER = '/01 - connectivity'
    IGNOREMATCHINGERRORS = FALSE
    ROUTE {fixture_route} '{fixture_base}/household_demographics.csv'
    CHARSET = 'UTF-8'
    COLUMNDELIMITER = ','
    HEADER = TRUE;

CREATE OR REPLACE WRAPPER DF wr_household_demographics
    FOLDER = '/01 - connectivity'
    DATASOURCENAME = ds_demo_households
    OUTPUTSCHEMA (
        hd_demo_sk = '"HD_DEMO_SK"',
        hd_income_band_sk = '"HD_INCOME_BAND_SK"',
        hd_buy_potential = '"HD_BUY_POTENTIAL"',
        hd_dep_count = '"HD_DEP_COUNT"',
        hd_vehicle_count = '"HD_VEHICLE_COUNT"'
    );

CREATE OR REPLACE TABLE bv_household_demographics I18N us_pst (
        hd_demo_sk:int, hd_income_band_sk:int, hd_buy_potential:text,
        hd_dep_count:int, hd_vehicle_count:int
    )
    FOLDER = '/01 - connectivity'
    CACHE OFF
    TIMETOLIVEINCACHE DEFAULT
    ADD SEARCHMETHOD wr_household_demographics (
        OUTPUTLIST ( hd_demo_sk, hd_income_band_sk, hd_buy_potential, hd_dep_count, hd_vehicle_count )
        WRAPPER (df wr_household_demographics)
    );
"""

[[step]]
id = "derived-views"
kind = "template"
channel = "vql"
address = "skills/views/SKILL.md#Derived view"
substitute = { sales_analytics = "{database}" }
database = "{database}"
check = "SELECT COUNT(*) AS n FROM household_income_by_band"

[[step]]
id = "derived-parameterised"
kind = "template"
channel = "vql"
address = "skills/views/references/derived.md#Parameterised views"
database = "{database}"
# A view with a parameter is read with the parameter as an equality: one band, its households.
check = "SELECT COUNT(*) FROM household_in_band WHERE band = 5 HAVING COUNT(*) = 360"

[[step]]
id = "derived-rename"
kind = "template"
channel = "vql"
address = "skills/views/references/derived.md#`ALTER VIEW`: what it cannot do"
database = "{database}"
check = "SELECT name FROM GET_VIEWS() WHERE input_database_name = '{database}' AND name = 'household_by_band'"

[[step]]
id = "dependencies-field-origin"
kind = "template"
channel = "vql"
address = "skills/views/references/dependencies.md#Where a field comes from"
substitute = { sales_analytics = "{database}" }
database = "{database}"
# The aggregate's column traced to the file's column it averages.
check = "SELECT column_name FROM COLUMN_DEPENDENCIES() WHERE input_view_database_name = '{database}' AND input_view_name = 'household_income_by_band' AND input_column_name = 'avg_vehicles' AND dependency_column_name = 'hd_vehicle_count'"

[[step]]
id = "interface-view"
kind = "template"
channel = "vql"
address = "skills/views/SKILL.md#Interface view — a contract you can re-implement"
# This block has no CONNECT DATABASE of its own — an unqualified SET IMPLEMENTATION
# relies on the session already being connected (real usage: --database on the command,
# per skills/execute/SKILL.md). `database` connects the step's own session directly, so
# the block runs verbatim, exactly as an agent would read it off the skill.
database = "{database}"
check = "SELECT household_sk FROM household_income LIMIT 10"

[[step]]
id = "interface-v2-implementation"
kind = "fixture"
channel = "vql"
database = "{database}"
# The second implementation the interface references swap in: the same rows under the column
# names their mappings read.
vql = """
