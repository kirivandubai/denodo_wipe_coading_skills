channel = "vql"
requires = ["enterprise_plus"]
address = "skills/security/references/policies.md#Masking"
substitute = { "RESTRICTION ( FILTER = '' MASKING ANY ( personal_data )" = "CREATE OR REPLACE GLOBAL_SECURITY_POLICY {tag_prefix}masking_ref\n    ENABLED = FALSE\n    AUDIENCE ( ANY ROLES ( {tag_prefix}sales_analyst ) )\n    ELEMENTS ( VIEW_DATABASES ( {database} ) COLUMNS TAGGED ANY ( {tag_prefix}personal_data ) )\n    RESTRICTION ( FILTER = '' MASKING ANY ( {tag_prefix}personal_data )" }
database = "{database}"
check = "SELECT name FROM GET_ELEMENTS() WHERE type = 'globalSecurityPolicy' AND name = '{tag_prefix}masking_ref'"

[[step]]
id = "security-policy-filter-deny"
kind = "template"
channel = "vql"
requires = ["enterprise_plus"]
address = "skills/security/references/policies.md#Row filter and deny"
# The condition names a tag (the server refuses one that is not), so the run's own tag goes in
# front of the filter policy, under the prefix [cleanup] drops it by.
substitute = { "RESTRICTION ( FILTER = 'sales_territory = ''EMEA''' REJECT )" = "CREATE OR REPLACE TAG {tag_prefix}sales_territory DESCRIPTION = 'The territory of a row, for the row filter';\nCREATE OR REPLACE GLOBAL_SECURITY_POLICY {tag_prefix}filter_emea\n    ENABLED = FALSE\n    AUDIENCE ( ANY ROLES ( {tag_prefix}sales_analyst ) )\n    ELEMENTS ( VIEW_DATABASES ( {database} ) COLUMNS TAGGED ANY ( {tag_prefix}personal_data ) )\n    RESTRICTION ( FILTER = '{tag_prefix}sales_territory = ''EMEA''' REJECT );", "RESTRICTION ( DENY )" = "CREATE OR REPLACE GLOBAL_SECURITY_POLICY {tag_prefix}deny_all\n    ENABLED = FALSE\n    AUDIENCE ( ANY ROLES ( {tag_prefix}sales_analyst ) )\n    ELEMENTS ( VIEW_DATABASES ( {database} ) COLUMNS TAGGED ANY ( {tag_prefix}personal_data ) )\n    RESTRICTION ( DENY );" }
database = "{database}"
check = "SELECT COUNT(*) FROM GET_ELEMENTS() WHERE type = 'globalSecurityPolicy' AND (name = '{tag_prefix}filter_emea' OR name = '{tag_prefix}deny_all') HAVING COUNT(*) = 2"

