channel = "http"
requires = ["cache"]
scheduler = true
address = "skills/scheduler/SKILL.md#Refresh the cache of a view on a schedule[1]"
substitute = { "<project_id>" = "{project_id}", "<job_id>" = "{job_id}" }
files = { "scheduler/sales_analytics/iv_household_income_cache.json" = { address = "skills/scheduler/SKILL.md#Refresh the cache of a view on a schedule[0]", substitute = { sales_analytics = "{database}", "<data_source_id>" = "{scheduler_data_source_id}" } } }
# the create call answers the new id; the read-back after it is what is judged
capture = { job_id = "id" }
capture_from = 0
expect_body = { disabled = "True", "extractionSection.loadprocesses.0.cacheInvalidationMode" = "ALL_ROWS", "extractionSection.loadprocesses.0.cacheAtomicOperation" = "True", "extractionSection.loadprocesses.0.loadProcessName" = "iv_household_income", "triggerSection.triggers.0.cronExpression" = "0 30 1 * * ?" }

[[step]]
