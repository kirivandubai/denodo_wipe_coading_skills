# --- AI functions: the server's LLM and embedding model, gated behind --with-ai ---------------
# The six blocks of skills/ai/SKILL.md. They write nothing outside {database}, but every one
# that evaluates an AI function sends paid requests to the LLM or the embedding model the
# server is configured with, and a server without that configuration (or without the
# Enterprise Plus bundle) fails them — so they carry ai = true and run only with --with-ai.
# The fixture keeps every run small and bounded: product_review is six rows of the demo
# return reasons, so the whole tail sends about 40 requests. product_review_vector embeds
# those six rows on every read (EMBED_AI in the view): a demo server has no vector table of
# its own in this database, and a full cache cannot store a vector column (skills/ai,
# "Common mistakes"). The search blocks read it as if it were a stored column; what they
# prove is the syntax and that a search answers, not the cost of one.

[[step]]
id = "ai-fixture"
kind = "fixture"
channel = "vql"
ai = true
database = "{database}"
check = "SELECT COUNT(*) AS n FROM product_review HAVING COUNT(*) = 6"
vql = """
CONNECT DATABASE {database};

CREATE OR REPLACE DATASOURCE DF ds_retail_reason
    FOLDER = '/01 - connectivity'
    IGNOREMATCHINGERRORS = FALSE
    ROUTE LOCAL 'LocalConnection' '{csv_dir}/reason.csv'
    CHARSET = 'UTF-8'
    COLUMNDELIMITER = ','
    HEADER = TRUE;

CREATE OR REPLACE WRAPPER DF wr_retail_reason
    FOLDER = '/01 - connectivity'
    DATASOURCENAME = ds_retail_reason
    OUTPUTSCHEMA (
        r_reason_sk = '"R_REASON_SK"',
        r_reason_id = '"R_REASON_ID"',
        r_reason_desc = '"R_REASON_DESC"'
    );

CREATE OR REPLACE TABLE bv_retail_reason I18N us_pst (
        r_reason_sk:int, r_reason_id:text, r_reason_desc:text
    )
    FOLDER = '/01 - connectivity'
    CACHE OFF
    TIMETOLIVEINCACHE DEFAULT
    ADD SEARCHMETHOD wr_retail_reason (
        OUTPUTLIST ( r_reason_sk, r_reason_id, r_reason_desc )
        WRAPPER (df wr_retail_reason)
    );

CREATE OR REPLACE VIEW product_review
    FOLDER = '/02 - integration'
    PRIMARY KEY ( 'review_id' )
    AS SELECT r_reason_sk AS review_id, TRIM(r_reason_desc) AS review_text
       FROM bv_retail_reason
       WHERE r_reason_sk <= 6;

CREATE OR REPLACE VIEW product_review_vector
    FOLDER = '/02 - integration'
    PRIMARY KEY ( 'review_id' )
    AS SELECT review_id, review_text, EMBED_AI(review_text, '{embedding_model}') AS review_vector
       FROM product_review;
"""

