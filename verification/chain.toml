# --- Metric view: the model, the views over it, the reads and the totals check ---------------
# The five blocks of skills/metrics/SKILL.md over the fixture's households and income bands
# and the association step's a_income_band_household. bv_income_band declares its key above:
# the metrics skill requires it of every dimension view (without it, a HAVING grouped by the
# key returns no rows). Every check is the block's claim — the same total three ways — not
# only that the server accepted it.

[[step]]
id = "metric-view"
kind = "template"
channel = "vql"
address = "skills/metrics/SKILL.md#The metric view"
substitute = { sales_analytics = "{database}" }
database = "{database}"
# "The grand total always counts every fact row": the metric with no dimension equals the
# fact's own count.
check = "SELECT m.n FROM (SELECT evaluate_metric(household_count) AS n FROM household_metrics) m CROSS JOIN (SELECT COUNT(hd_demo_sk) AS f FROM bv_household_demographics) b WHERE m.n = b.f AND m.n > 0"

[[step]]
id = "metric-selection-views"
kind = "template"
channel = "vql"
address = "skills/metrics/SKILL.md#Selection views, a total and a share"
substitute = { sales_analytics = "{database}" }
database = "{database}"
# The shares add up to 100 and the bands to every household — what a total taken from the
# metric, not from the rows, has to give.
check = "SELECT SUM(household_count) AS households FROM household_share_by_band HAVING SUM(household_share_pct) = 100 AND SUM(household_count) = 7200"

[[step]]
id = "metric-query"
kind = "template"
channel = "vql"
address = "skills/metrics/SKILL.md#Query it ad hoc"
database = "{database}"
# The block's HAVING is grouped by income_band_sk, the key of bv_income_band: it returns rows
# only because the fixture declares that key.
check = "SELECT income_band_sk, buy_potential, evaluate_metric(household_count) AS household_count FROM household_metrics WHERE buy_potential = '>10000' GROUP BY income_band_sk, buy_potential HAVING evaluate_metric(household_count) > 50"

[[step]]
id = "metric-read"
kind = "template"
channel = "vql"
address = "skills/metrics/SKILL.md#3. Read what exists"
substitute = { sales_analytics = "{database}" }
database = "{database}"
check = "SELECT COUNT(*) AS metrics FROM GET_VIEW_COLUMNS() WHERE input_database_name = '{database}' AND input_view_name = 'household_metrics' AND column_organization = 'metric' HAVING COUNT(*) = 3"

[[step]]
id = "metric-totals-check"
kind = "template"
channel = "vql"
address = "skills/metrics/SKILL.md#Verify — the totals check"
substitute = { sales_analytics = "{database}" }
database = "{database}"
# Row 1 of the block's table: the slices of the income-band dimension add up to the fact.
check = "SELECT s.t FROM (SELECT SUM(x.household_count) AS t FROM (SELECT income_band_sk, evaluate_metric(household_count) AS household_count FROM household_metrics GROUP BY income_band_sk) x) s CROSS JOIN (SELECT COUNT(hd_demo_sk) AS f FROM bv_household_demographics) b WHERE s.t = b.f"

# --- Security: a role, a masking policy over tagged columns, checked as a person -----------
# The four blocks of skills/security/SKILL.md over the views the steps above built, plus the
# claim its "view's own file" rests on. Everything here is server-wide — a user, a role, a tag
# and a global security policy — so every name carries {tag_prefix} and [cleanup] drops them
# by name; the policy is limited to {database} by VIEW_DATABASES, so no view outside this run
# is ever restricted. The user is EXTERNAL: there is no password anywhere, and the checks read
# as that user through CONTEXT ('impersonate_user' = …). That needs the profile's user to hold
# the role impersonator — `env check` reports it as vdp.impersonation; without it these checks
# fail with "This user cannot impersonate", which is the answer, not a bug in the template.

[[step]]
id = "security-user"
kind = "fixture"
channel = "vql"
vql = "CREATE OR REPLACE USER {tag_prefix}reader EXTERNAL 'Verification chain: the person a policy is checked as';"

[[step]]
id = "security-role"
kind = "template"
channel = "vql"
requires = ["impersonation"]
address = "skills/security/SKILL.md#A role that reads the marts, given to a user"
substitute = { sales_analytics = "{database}", sales_analyst = "{tag_prefix}sales_analyst", mlee = "{tag_prefix}reader" }
# The user reads the view through the role alone: EXECUTE on the view is enough, nothing below
# it is granted.
check = "SELECT COUNT(*) AS n FROM household_income HAVING COUNT(*) > 0 CONTEXT ('impersonate_user' = '{tag_prefix}reader')"
database = "{database}"

[[step]]
id = "security-read"
kind = "template"
channel = "vql"
address = "skills/security/SKILL.md#Before you change anything"
substitute = { sales_analytics = "{database}" }
database = "{database}"
# Query 1's claim: the grant arrives through the role, so rolename is filled in.
check = "SELECT username FROM CATALOG_PERMISSIONS() WHERE dbname = '{database}' AND username = '{tag_prefix}reader' AND rolename = '{tag_prefix}sales_analyst'"

[[step]]
id = "security-policy"
kind = "template"
channel = "vql"
requires = ["enterprise_plus"]
address = "skills/security/SKILL.md#Tag the columns, then the policy"
substitute = { sales_analytics = "{database}", personal_data = "{tag_prefix}personal_data", sales_analyst = "{tag_prefix}sales_analyst", analyst_masking = "{tag_prefix}analyst_masking" }
database = "{database}"
check = "SELECT name FROM GET_ELEMENTS() WHERE type = 'globalSecurityPolicy' AND name = '{tag_prefix}analyst_masking' AND element_status = 'OK'"

[[step]]
id = "security-view-tags"
kind = "template"
channel = "vql"
requires = ["enterprise_plus", "impersonation"]
address = "skills/security/SKILL.md#The tag in the view's own file"
substitute = { sales_analytics = "{database}", personal_data = "{tag_prefix}personal_data" }
database = "{database}"
# Masked for the person, through the interface view above the tagged one: a filter compares
# the masked value, so no row may survive "not masked".
check = "SELECT household_sk FROM household_income WHERE buy_potential <> '********' LIMIT 1 CONTEXT ('impersonate_user' = '{tag_prefix}reader')"
expect = "no rows"

[[step]]
id = "security-check"
kind = "template"
channel = "vql"
requires = ["enterprise_plus", "impersonation"]
address = "skills/security/SKILL.md#Check it as the people it is for"
substitute = { sales_analytics = "{database}", mlee = "{tag_prefix}reader", sales_analyst = "{tag_prefix}sales_analyst" }
database = "{database}"
# The message template's claim: an aggregate over a hidden number becomes NULL for the role.
check = "SELECT income_band_sk FROM household_income_by_band WHERE avg_dependents IS NOT NULL CONTEXT ('impersonate_roles' = '{tag_prefix}sales_analyst')"
expect = "no rows"

[[step]]
id = "security-read-as-someone"
kind = "template"
channel = "vql"
requires = ["impersonation"]
address = "skills/security/references/privileges.md#Checking as someone else"
# The block's two forms, over the chain's interface view, as its person and as its role.
substitute = { "SELECT … FROM <view>" = "SELECT COUNT(*) AS n FROM household_income", "'<user>'" = "'{tag_prefix}reader'", "'<role>[,<role>…]'" = "'{tag_prefix}sales_analyst'" }
database = "{database}"

[[step]]
id = "security-reapply"
kind = "template"
channel = "vql"
requires = ["enterprise_plus", "impersonation"]
# The claim the security skill puts the tag in the view's own file for: re-applying the view's
# file without its TAGS takes the tag off the column, and the mask with it, silently. The file
# here is the views skill's Derived view block, which carries no TAGS; the check expects the
# person to read the real values again.
address = "skills/views/SKILL.md#Derived view"
substitute = { sales_analytics = "{database}" }
database = "{database}"
check = "SELECT household_sk FROM household_income WHERE buy_potential <> '********' LIMIT 1 CONTEXT ('impersonate_user' = '{tag_prefix}reader')"

# The reference blocks of security: whole policies made of the restriction fragments, created
# disabled in the form of the template above and dropped by name in [cleanup]; the reads; and
# last the grants and revokes, which take the role away from the run's user.

[[step]]
id = "security-policy-masking"
