# --- Tables stored from a query: gated behind --with-writes ------------------------------
# The eight blocks of skills/materialize/SKILL.md, in its order. A remote table, a summary and a
# data movement each create a table in a source database, so they write into the same place
# the dml steps do: the server's cache data source, catalog and schema from [values]. The
# template's ds_dwh / 'dwh' / 'reporting' are substituted with those, its table names get the
# verify_ prefix, and its sources are the chain's own iv_household_income (7,200 households)
# and bv_income_band (the band file). The last template drops the summary and the remote table;
# [cleanup] writes takes both names over and drops them again, so a run that stops halfway
# leaves nothing in the cache database.

[[step]]
id = "materialize-name-check"
kind = "template"
channel = "vql"
writes = true
address = "skills/materialize/SKILL.md#Before you create: is the name free, and what will land"
substitute = { "input_database_name = 'sales_analytics' AND input_datasource_name = 'ds_dwh'" = "input_database_name = '{write_datasource_database}' AND input_datasource_name = '{write_datasource_name}'", "input_catalog_name = 'dwh' AND input_schema_name = 'reporting'" = "input_catalog_name = '{write_catalog}' AND input_schema_name = '{write_schema}'", "UPPER('household_income')" = "UPPER('{tag_prefix}household_income')", sales_analytics = "{database}" }
database = "{database}"
# The block's claim: the name is free before the create.
check = "SELECT table_name FROM GET_JDBC_DATASOURCE_TABLES() WHERE input_database_name = '{write_datasource_database}' AND input_datasource_name = '{write_datasource_name}' AND input_catalog_name = '{write_catalog}' AND input_schema_name = '{write_schema}' AND table_name = '{tag_prefix}household_income'"
expect = "no rows"

[[step]]
id = "materialize-remote-table"
kind = "template"
channel = "vql"
writes = true
address = "skills/materialize/SKILL.md#A remote table"
substitute = { "remote_table_name = 'household_income'" = "remote_table_name = '{tag_prefix}household_income'", "datasource_database_name = 'sales_analytics'" = "datasource_database_name = '{write_datasource_database}'", "datasource_name = 'ds_dwh'" = "datasource_name = '{write_datasource_name}'", "datasource_catalog = 'dwh'" = "datasource_catalog = '{write_catalog}'", "datasource_schema = 'reporting'" = "datasource_schema = '{write_schema}'", sales_analytics = "{database}" }
database = "{database}"
# Every household landed, and the base view carries the load query REFRESH needs.
check = "SELECT COUNT(*) FROM bv_dwh_household_income HAVING COUNT(*) = 7200"

[[step]]
id = "materialize-refresh"
kind = "template"
channel = "vql"
writes = true
address = "skills/materialize/SKILL.md#Refresh it"
substitute = { sales_analytics = "{database}" }
database = "{database}"
check = "SELECT COUNT(*) FROM bv_dwh_household_income HAVING COUNT(*) = 7200"

[[step]]
id = "materialize-summary"
kind = "template"
channel = "vql"
writes = true
address = "skills/materialize/SKILL.md#A summary — created unloaded, proved by the plan, then loaded"
substitute = { "INTO ds_dwh" = "INTO {write_datasource_database}.{write_datasource_name}", "CATALOG = 'dwh'" = "CATALOG = '{write_catalog}'", "SCHEMA = 'reporting'" = "SCHEMA = '{write_schema}'", "RELATIONNAME = 's_household_band'" = "RELATIONNAME = '{tag_prefix}s_household_band'", sales_analytics = "{database}" }
database = "{database}"
# Unloaded, the optimizer still plans the query over the views; with consider_all_summaries it
# would use the summary. The check is the first half: no summary in the plain plan yet.
check = "SELECT 1 FROM GET_QUERY_EXECUTION_PLAN() WHERE input_query = 'SELECT income_band_sk, COUNT(*) AS households FROM iv_household_income GROUP BY income_band_sk' AND execution_plan LIKE '%Summary Acceleration%'"
expect = "no rows"

[[step]]
id = "materialize-summary-load"
kind = "template"
channel = "vql"
writes = true
address = "skills/materialize/SKILL.md#A summary — created unloaded, proved by the plan, then loaded[1]"
substitute = { sales_analytics = "{database}" }
database = "{database}"
# Loaded, the same query is answered from the summary.
check = "SELECT 1 FROM GET_QUERY_EXECUTION_PLAN() WHERE input_query = 'SELECT income_band_sk, COUNT(*) AS households FROM iv_household_income GROUP BY income_band_sk' AND execution_plan LIKE '%Summary Acceleration%'"

[[step]]
id = "materialize-data-movement"
kind = "template"
channel = "vql"
writes = true
address = "skills/materialize/SKILL.md#Data movement for a federated join"
substitute = { "JDBC ds_dwh" = "JDBC {write_datasource_database}.{write_datasource_name}", sales_analytics = "{database}" }
database = "{database}"
# The band file moves next to the remote table, and the join runs there.
check = "SELECT 1 FROM GET_QUERY_EXECUTION_PLAN() WHERE input_query = 'SELECT buy_potential, COUNT(*) AS households FROM household_band_detail GROUP BY buy_potential' AND execution_plan LIKE '%Data Movement%'"

[[step]]
id = "materialize-table"
kind = "template"
channel = "vql"
writes = true
address = "skills/materialize/SKILL.md#A materialized table"
substitute = { sales_analytics = "{database}" }
database = "{database}"
check = "SELECT COUNT(*) FROM income_band_target HAVING COUNT(*) = 3"

[[step]]
id = "materialize-drop-readers"
kind = "fixture"
channel = "vql"
writes = true
database = "{database}"
# The drop template refuses a base view something reads (drop_base_view_on_cascade = false);
# the data movement view above reads the remote table, so it goes first.
vql = """
CONNECT DATABASE {database};

DROP VIEW IF EXISTS household_band_detail;
"""

[[step]]
id = "materialize-drop"
kind = "template"
channel = "vql"
writes = true
address = "skills/materialize/SKILL.md#Drop — on the human's yes"
substitute = { sales_analytics = "{database}" }
database = "{database}"
# Both tables are gone from the database, not only their views.
check = "SELECT table_name FROM GET_JDBC_DATASOURCE_TABLES() WHERE input_database_name = '{write_datasource_database}' AND input_datasource_name = '{write_datasource_name}' AND input_catalog_name = '{write_catalog}' AND input_schema_name = '{write_schema}' AND (table_name = '{tag_prefix}household_income' OR table_name = '{tag_prefix}s_household_band')"
expect = "no rows"

[[step]]
id = "nothing-invalid"
kind = "fixture"
channel = "vql"
database = "{database}"
vql = "CONNECT DATABASE {database};"
check = "SELECT name FROM GET_VIEWS() WHERE input_database_name = '{database}' AND input_retrieve_invalid_views_only = true"
expect = "no rows"

# --- Data Marketplace tail: http channel, gated behind --with-marketplace --------------
#
# Not idempotent, by design: marketplace-tag fires its lookup and create calls
# unconditionally (see its own comment below) rather than branching on the lookup's
# answer; marketplace-category has no lookup call at all — the skill's "Category tree"
# block goes straight to create (calls = [0]) — so there is nothing to branch on in the
# first place. Either way, this step model has no way to express "read, then decide", and
# adding one would turn the manifest into the interpreter this design deliberately avoids
# (skills/marketplace/SKILL.md's own rule, "anything that runs twice must read before it
# writes", is deliberately not followed here). A second
# --with-marketplace run against a marketplace that still holds the previous run's objects
# — the state a --keep run leaves behind — fails loudly on 409 (duplicate name) at the
# create call, exactly as the skill's own "common mistakes" table predicts; that failure is
# honest, not a bug, and since T17 it explains itself in the report: a 409 arrives with an
# empty body, so the step's error carries the hint HTTP_HINTS supplies
# (denodo_cli/commands/verify.py) instead of a bare status. The fix stays operational, not
# code: either let a normal (non --keep) run finish so its own cleanup removes what it
# created, or remove the leftover tag/category by hand (DELETE /public/api/tags/<id>,
# DELETE /public/api/category-management/categories/<id>) before running again.

[[step]]
id = "marketplace-sync"
kind = "template"
channel = "http"
address = "skills/marketplace/SKILL.md#Synchronising the marketplace catalog with VDP"
marketplace = true
# calls = [] (default): all four — the two read-only "changes" calls, then both
# synchronize calls, which the block itself already pins to proceedWithConflicts =
# "SERVER_WITH_LOCAL_CHANGES", the only mode approved for this chain to run unattended.

[[step]]
id = "marketplace-tag"
kind = "template"
channel = "http"
address = "skills/marketplace/SKILL.md#Tag, with an assignment"
marketplace = true
# 0 = lookup by nameFilter, 1 = create. 2 (update) and 3 (assign to a view) are left out:
# this chain never conditions on the lookup's answer, and it has no marketplace view id to
# assign to — assigning is the skill's concern, not this template's verification.
calls = [0, 1]
capture = { tag_id = "id" }
substitute = { "nameFilter=pii" = "nameFilter={tag_prefix}pii", "\"name\":\"pii\"" = "\"name\":\"{tag_prefix}pii\"" }

[[step]]
id = "marketplace-category"
kind = "template"
channel = "http"
address = "skills/marketplace/SKILL.md#Category tree"
marketplace = true
# 0 = create the top-level category. 1 (create a child under it) and 2 (assign it to
# views) are left out for the same reason as the tag step above.
calls = [0]
capture = { category_id = "id" }
substitute = { "\"name\":\"Consumer marts\"" = "\"name\":\"{tag_prefix}Consumer marts\"" }

# --- External element: the http half of the chain above ------------------------------
#
# T12 left this template out on the grounds that its VQL comes from a marketplace response
# (GET .../vql-metadata), which no step can feed to another. That turned out to be one
# reading too many: the skill carries the VQL half as its own block (the step above runs it
# verbatim), and vql-metadata is a call to make, not a body to run — the marketplace answers
# with the contract it expects, and the block already matches it. What the chain does need is
# the id of one call in the next call's body, and that is what `capture` has always done for
# the tag step. So: three steps, one per id boundary.
#
# Together the three steps below run all four of the block's calls, but each of them runs a
# subset, and --update-marks asks that question per step (design spec 11.1) — so none of
# them re-dates the block's mark. The same price the tag and category steps pay, for a
# slightly different reason: there the calls really are left out, here they are merely
# split across steps because each id has to be captured before the next call can use it.
#
# Both objects are marketplace-wide, like the tag and the category: named with the verify_
# prefix, removed by captured id in [cleanup] http, and a second --with-marketplace run over
# what a --keep run left behind fails on 409 exactly as they do.

[[step]]
id = "external-provider-type"
kind = "template"
channel = "http"
address = "skills/marketplace/SKILL.md#External element — a dashboard, job or contract from another tool[0]"
marketplace = true
# 0 = create the provider type. This is the set's only multipart call (--part), and the one
# call the executor used to drop the body of.
calls = [0]
capture = { provider_type_id = "externalProviderTypeId" }
substitute = { "\"ACME_BI\"" = "\"{tag_prefix}ACME_BI\"" }

[[step]]
id = "external-tool-server"
kind = "template"
channel = "http"
address = "skills/marketplace/SKILL.md#External element — a dashboard, job or contract from another tool[0]"
marketplace = true
# 1 = create the server that reads the contract. The template's literal 30 is the id the
# previous step just captured; its database is this run's test database.
calls = [1]
capture = { tool_server_id = "id" }
substitute = { "\"acme_bi_server\"" = "\"{tag_prefix}acme_bi_server\"", "\"externalProviderTypeId\":30" = "\"externalProviderTypeId\":{provider_type_id}", sales_analytics = "{database}" }

[[step]]
id = "external-element-import"
kind = "template"
channel = "http"
address = "skills/marketplace/SKILL.md#External element — a dashboard, job or contract from another tool[0]"
marketplace = true
# 2 = ask the marketplace for the contract it expects (read-only; the block's own comment
# says the answer is the VQL the step above already ran), 3 = import. The template's literal
# 217 is the server id captured above, and it occurs in both the path of 2 and the body of 3.
calls = [2, 3]
substitute = { "217" = "{tool_server_id}" }

# --- Renamed view keeps its marketplace element ----------------------------------------
#
# The rename block's claim is that the element survives: the same id under the new name,
# because the pair is matched in the synchronize call. Three steps, because the rename itself
# is VQL and sits between the block's first call and the rest: 0 reads the element before the
# rename and captures its id, the fixture renames the view in VDP, then 1-3 read the radius,
# synchronise with the pair matched and read the element back — and expect_body fails the run
# unless the new name answers with the id captured before. A server that ignored the pair
# would hand out a new id, and the step would otherwise stay green.
#
# household_income_by_band is renamed last on purpose: everything that reads it has run, and
# nothing-invalid above has already checked the database. The cleanup's DROP DATABASE and the
# two re-syncs take the renamed view and its element out like any other.
#
# Like the external-element steps, each of these runs a subset of the block's calls, so none
# of them re-dates its mark under --update-marks.

[[step]]
id = "marketplace-rename-before"
kind = "template"
channel = "http"
address = "skills/marketplace/SKILL.md#A view in the marketplace is renamed, recreated or moved"
marketplace = true
# 0 = view-details on the old name, before anything changes.
calls = [0]
capture = { renamed_view_id = "id" }
substitute = { sales_analytics = "{database}" }

[[step]]
id = "marketplace-rename-vdp"
kind = "fixture"
channel = "vql"
marketplace = true
database = "{database}"
vql = "ALTER VIEW household_income_by_band RENAME household_income_per_band;"
check = "SELECT name FROM GET_VIEWS() WHERE input_database_name = '{database}' AND name = 'household_income_per_band'"

[[step]]
id = "marketplace-rename-match"
kind = "template"
channel = "http"
address = "skills/marketplace/SKILL.md#A view in the marketplace is renamed, recreated or moved"
marketplace = true
# 1 = changes, 2 = synchronize with the pair matched, 3 = view-details on the new name.
calls = [1, 2, 3]
substitute = { sales_analytics = "{database}" }
expect_body = { id = "{renamed_view_id}" }
