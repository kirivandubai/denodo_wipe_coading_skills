        wr_refunded_cash = '"WR_REFUNDED_CASH"',
        wr_reversed_charge = '"WR_REVERSED_CHARGE"',
        wr_account_credit = '"WR_ACCOUNT_CREDIT"',
        wr_net_loss = '"WR_NET_LOSS"'
    );

CREATE OR REPLACE TABLE bv_retail_web_returns I18N us_pst (
        wr_returned_date_sk:int, wr_returned_time_sk:int, wr_item_sk:int, wr_refunded_customer_sk:int, wr_refunded_cdemo_sk:int, wr_refunded_hdemo_sk:int, wr_refunded_addr_sk:int, wr_returning_customer_sk:int, wr_returning_cdemo_sk:int, wr_returning_hdemo_sk:int, wr_returning_addr_sk:int, wr_web_page_sk:int, wr_reason_sk:int, wr_order_number:int, wr_return_quantity:int, wr_return_amt:decimal, wr_return_tax:decimal, wr_return_amt_inc_tax:decimal, wr_fee:decimal, wr_return_ship_cost:decimal, wr_refunded_cash:decimal, wr_reversed_charge:decimal, wr_account_credit:decimal, wr_net_loss:decimal
    )
