# --- Writes through a view: gated behind --with-writes ------------------------------------
# The seven blocks of skills/dml/SKILL.md, in its order. They need a table someone may write
# to, and the only one every server has room for is in its cache database: writes-tables
# creates two there with CREATE REMOTE TABLE (an identity-keyed orders table and a customer
# table keyed by its code, for the upsert), and [cleanup] writes drops both. The base views are
# written here with the source's type metadata the introspection would give them, because the
# skill's RETURNING and GET_VIEW_COLUMNS claims hold only for such a base view. Every write the
# blocks make lands in those two tables. The template names bv_orders_db_orders and
# bv_orders_db_customer are substituted, so the JDBC template's own base view of that name, over
# an unreachable host, is left alone.

[[step]]
id = "writes-tables"
kind = "fixture"
channel = "vql"
writes = true
database = "{database}"
check = "SELECT COUNT(*) FROM bv_write_customer HAVING COUNT(*) = 18"
vql = """
CONNECT DATABASE {database};

CREATE OR REPLACE REMOTE TABLE {tag_prefix}orders INTO {write_datasource_database}.{write_datasource_name}
    CATALOG = '{write_catalog}' SCHEMA = '{write_schema}'
    CREATE_TABLE_TEMPLATE ('CREATE TABLE @{internal_parameter_table_name} (order_id {write_identity} NOT NULL, customer_id VARCHAR(12) NOT NULL, order_dt {write_timestamp} NULL, total_amount DECIMAL(12,2) NULL, status VARCHAR(12) NULL, @{internal_parameter_columns}, PRIMARY KEY (order_id))')
    AS SELECT 'x' AS note FROM bv_income_band WHERE ib_income_band_sk < 0;

CREATE OR REPLACE REMOTE TABLE {tag_prefix}customer INTO {write_datasource_database}.{write_datasource_name}
    CATALOG = '{write_catalog}' SCHEMA = '{write_schema}'
    CREATE_TABLE_TEMPLATE ('CREATE TABLE @{internal_parameter_table_name} (customer_id VARCHAR(12) NOT NULL, customer_name VARCHAR(40) NULL, segment VARCHAR(12) NULL, @{internal_parameter_columns}, PRIMARY KEY (customer_id))')
    AS SELECT 'x' AS note FROM bv_income_band WHERE ib_income_band_sk < 0;

CREATE OR REPLACE WRAPPER JDBC wr_write_orders
    FOLDER = '/01 - connectivity'
    DATASOURCENAME = {write_datasource_database}.{write_datasource_name}
    CATALOGNAME = '{write_catalog}'
    SCHEMANAME = '{write_schema}'
    RELATIONNAME = '{tag_prefix}orders'
    OUTPUTSCHEMA (
        order_id = 'order_id' :'java.lang.Integer' (OPT) (sourcetypeid = '4', sourcetypesize = '10') NOT NULL SORTABLE IS_AUTOINCREMENT,
        customer_id = 'customer_id' :'java.lang.String' (OPT) (sourcetypeid = '12', sourcetypesize = '12') NOT NULL SORTABLE,
        order_dt = 'order_dt' :'java.time.LocalDateTime' (OPT) (sourcetypeid = '93') SORTABLE,
        total_amount = 'total_amount' :'java.math.BigDecimal' (OPT) (sourcetypeid = '3', sourcetypesize = '12', sourcetypedecimals = '2') SORTABLE,
        status = 'status' :'java.lang.String' (OPT) (sourcetypeid = '12', sourcetypesize = '12') SORTABLE
    )
    PRIMARY KEY ( 'order_id' );

CREATE OR REPLACE TABLE bv_write_orders I18N us_pst (
        order_id:int (notnull, autoincrement, sourcetypeid = '4', sourcetypesize = '10'),
        customer_id:text (notnull, sourcetypeid = '12', sourcetypesize = '12'),
        order_dt:timestamp (sourcetypeid = '93'),
        total_amount:decimal (sourcetypeid = '3', sourcetypesize = '12', sourcetypedecimals = '2'),
        status:text (sourcetypeid = '12', sourcetypesize = '12')
    )
    FOLDER = '/01 - connectivity'
    PRIMARY KEY ( 'order_id' )
    CACHE OFF
    TIMETOLIVEINCACHE DEFAULT
    ADD SEARCHMETHOD wr_write_orders (
        OUTPUTLIST ( order_id, customer_id, order_dt, total_amount, status )
        WRAPPER (jdbc wr_write_orders)
    );

CREATE OR REPLACE WRAPPER JDBC wr_write_customer
    FOLDER = '/01 - connectivity'
    DATASOURCENAME = {write_datasource_database}.{write_datasource_name}
    CATALOGNAME = '{write_catalog}'
    SCHEMANAME = '{write_schema}'
    RELATIONNAME = '{tag_prefix}customer'
    OUTPUTSCHEMA (
        customer_id = 'customer_id' :'java.lang.String' (OPT) (sourcetypeid = '12', sourcetypesize = '12') NOT NULL SORTABLE,
        customer_name = 'customer_name' :'java.lang.String' (OPT) (sourcetypeid = '12', sourcetypesize = '40') SORTABLE,
        segment = 'segment' :'java.lang.String' (OPT) (sourcetypeid = '12', sourcetypesize = '12') SORTABLE
    )
    PRIMARY KEY ( 'customer_id' );

CREATE OR REPLACE TABLE bv_write_customer I18N us_pst (
        customer_id:text (notnull, sourcetypeid = '12', sourcetypesize = '12'),
        customer_name:text (sourcetypeid = '12', sourcetypesize = '40'),
        segment:text (sourcetypeid = '12', sourcetypesize = '12')
    )
    FOLDER = '/01 - connectivity'
    PRIMARY KEY ( 'customer_id' )
    CACHE OFF
    TIMETOLIVEINCACHE DEFAULT
    ADD SEARCHMETHOD wr_write_customer (
        OUTPUTLIST ( customer_id, customer_name, segment )
        WRAPPER (jdbc wr_write_customer)
    );

INSERT INTO bv_write_orders
SELECT CONCAT('C-', ib_income_band_sk) AS customer_id, TIMESTAMP '2026-09-01 10:00:00' AS order_dt,
       ib_lower_bound AS total_amount, 'open' AS status
FROM bv_income_band;

INSERT INTO bv_write_customer
SELECT CONCAT('C-', ib_income_band_sk) AS customer_id, CONCAT('Customer ', ib_income_band_sk) AS customer_name,
       'retail' AS segment
FROM bv_income_band
WHERE ib_income_band_sk <= 18;

CREATE OR REPLACE VIEW order_import
    FOLDER = '/02 - integration'
    AS SELECT CONCAT('I-', ib_income_band_sk) AS customer_id, TIMESTAMP '2026-10-01 08:00:00' AS order_dt,
              ib_upper_bound AS total_amount, 'open' AS status, 42 AS batch_id
       FROM bv_income_band
       WHERE ib_income_band_sk <= 3;

CREATE OR REPLACE VIEW customer_update
    FOLDER = '/02 - integration'
    AS SELECT CONCAT('C-', ib_income_band_sk) AS customer_id, CONCAT('Customer ', ib_income_band_sk, ' Ltd') AS customer_name,
              'wholesale' AS segment
       FROM bv_income_band
       WHERE ib_income_band_sk >= 15;
"""

